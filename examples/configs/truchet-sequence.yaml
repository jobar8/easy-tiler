grid:
  width: 18
  height: 18
  x_size: 100
  y_size: 100

factory:
  type: sequence # tile, sequence, node, or form
  tile_type: truchet
  tile_sequence: [0, 1, 2, 3]
  primary_color: random
  secondary_color: transparent
  radius: 0.2
  stroke: false
  stroke_color: black
  palette: FridaKahlo
  num_colors: 5
  use_seed: false

output:
  path: ../images/truchet-sequence # output basename, relative to this YAML file
  formats: [png, svg] # either, or both
  scale: 1
  background_col: black

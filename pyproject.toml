[project]
name = "easy-tiler"
version = "0.5.0"
description = "Library for tiling and patterns"
readme = "README.md"
authors = [
    { name = "Joseph Barraud", email = "joseph.barraud@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pycairo>=1.23.0",
    "pillow>=12.3.0",
    "numpy>=2.5.2",
    "colorcet>=3.1.0",
    "pypalettes>=0.2.1",
]

[project.scripts]
easy-tiler = "easy_tiler:main"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=9.1.1",
    "ruff>=0.15.4",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
preview = true

[tool.ruff.format]
# Prefer single quotes over double quotes.
quote-style = "single"
